<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Spoofer - Railway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e14;
            font-family: 'Segoe UI', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1f2b;
            border-radius: 28px;
            padding: 35px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid #2f3a4b;
        }
        h1 { color: #eef2f7; font-weight: 500; font-size: 26px; display: flex; gap: 12px; margin-bottom: 6px; }
        .sub {
            color: #8896ab; font-size: 14px; border-left: 3px solid #f0b34b;
            padding-left: 14px; margin-bottom: 24px; background: #252e3d;
            border-radius: 0 12px 12px 0; padding: 10px 16px;
        }
        textarea {
            width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #314159;
            background: #0f141e; color: #d6e0f0; font-size: 15px; min-height: 100px;
            font-family: 'Courier New', monospace; resize: vertical;
        }
        textarea:focus { border-color: #f0b34b; box-shadow: 0 0 0 3px rgba(240,179,75,0.15); }
        .action-bar {
            display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0;
        }
        .action-bar button {
            padding: 12px 22px; border-radius: 40px; border: none;
            background: #2a3345; color: #d6e0f0; font-weight: 600; cursor: pointer;
            flex: 1 1 auto; transition: 0.15s;
        }
        .action-bar button:active { transform: scale(0.96); }
        .action-bar .primary { background: #f0b34b; color: #0b0e14; }
        .action-bar .primary:hover { background: #ffc86b; }
        .action-bar .dl-bulk { background: #4caf84; color: #0b0e14; }
        .action-bar .dl-bulk:hover { background: #5edb9f; }
        #status {
            background: #0f141e; border-radius: 16px; padding: 16px;
            color: #b3c2d9; font-size: 14px; min-height: 70px;
            border: 1px dashed #2f3a4b; font-family: monospace;
            max-height: 180px; overflow-y: auto; line-height: 1.6;
        }
        .log-success { color: #8bdfb0; }
        .log-error { color: #f48b8b; }
        .log-info { color: #f0b34b; }
        .footnote { color: #5a6a80; font-size: 12px; text-align: center; margin-top: 20px; border-top: 1px solid #1f2836; padding-top: 16px; }
        .badge { background: #2f3a4b; color: #f0b34b; padding: 2px 14px; border-radius: 40px; font-size: 12px; font-weight: 600; }
        #progress { width: 100%; height: 6px; background: #1f2836; border-radius: 10px; margin: 12px 0; overflow: hidden; }
        #progressFill { height: 100%; width: 0%; background: #f0b34b; border-radius: 10px; transition: width 0.3s; }
    </style>
</head>
<body>
<div class="card">
    <h1>📦 Bulk Spoofer <span style="color:#f0b34b;">Railway</span></h1>
    <div class="sub"><span class="badge">SERVER PROXY</span> &nbsp; Download ZIP or single</div>

    <textarea id="idList" placeholder="Paste ID, pisah koma / newline&#10;Contoh: 9124851790, 71693666775697">9124851790, 71693666775697</textarea>

    <div class="action-bar">
        <button class="dl-bulk" id="bulkZipBtn">📦 Download ZIP (Bulk)</button>
        <button class="primary" id="singleTestBtn">🔍 Test Single ID</button>
        <button id="clearBtn">🗑️ Clear</button>
    </div>

    <div id="progress"><div id="progressFill"></div></div>
    <div id="status">⏳ Siap. Server aktif.</div>
    <div class="footnote">Backend proxy di Railway · Bebas CORS</div>
</div>

<script>
    const idList = document.getElementById('idList');
    const bulkZipBtn = document.getElementById('bulkZipBtn');
    const singleTestBtn = document.getElementById('singleTestBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusDiv = document.getElementById('status');
    const progressFill = document.getElementById('progressFill');

    function log(msg, type = 'info') {
        const entry = document.createElement('div');
        entry.className = `log-${type}`;
        entry.textContent = msg;
        statusDiv.appendChild(entry);
        statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    function clearLog() { statusDiv.innerHTML = ''; }

    function parseIds(text) {
        return text.split(/[\s,;\n]+/).map(s => s.trim()).filter(s => /^\d+$/.test(s));
    }

    function updateProgress(pct) {
        progressFill.style.width = Math.min(pct, 100) + '%';
    }

    // --- Bulk ZIP ---
    bulkZipBtn.addEventListener('click', async () => {
        const ids = parseIds(idList.value);
        if (ids.length === 0) {
            log('⚠️ Gak ada ID valid.', 'error');
            return;
        }
        clearLog();
        log(`🚀 Mengirim ${ids.length} ID ke server untuk dibuat ZIP...`, 'info');
        updateProgress(10);

        try {
            const response = await fetch('/bulk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Server error: ${response.status} - ${errText}`);
            }

            // Download ZIP
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `roblox_bulk_${Date.now()}.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

            log(`✅ ZIP berhasil di-download (${(blob.size / 1024).toFixed(1)} KB)`, 'success');
            updateProgress(100);
        } catch (err) {
            log(`❌ Gagal: ${err.message}`, 'error');
            updateProgress(0);
        }
    });

    // --- Test Single ID (download langsung) ---
    singleTestBtn.addEventListener('click', async () => {
        const ids = parseIds(idList.value);
        if (ids.length === 0) {
            log('⚠️ Gak ada ID untuk di-test.', 'error');
            return;
        }
        const id = ids[0];
        clearLog();
        log(`🔍 Menguji ID ${id}...`, 'info');
        updateProgress(20);

        try {
            // Fetch langsung ke endpoint download server
            const response = await fetch(`/download/${id}`);
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Server error: ${response.status} - ${errText}`);
            }

            // Trigger download
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // ambil nama dari header content-disposition kalau ada
            const disposition = response.headers.get('content-disposition');
            let filename = `roblox_${id}.ogg`;
            if (disposition && disposition.includes('filename=')) {
                const match = disposition.match(/filename="(.+?)"/);
                if (match) filename = match[1];
            }
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

            log(`✅ Download ID ${id} berhasil`, 'success');
            updateProgress(100);
        } catch (err) {
            log(`❌ Gagal: ${err.message}`, 'error');
            updateProgress(0);
        }
    });

    clearBtn.addEventListener('click', () => {
        idList.value = '';
        clearLog();
        log('🗑️ Direset.', 'info');
        updateProgress(0);
    });

    // initial log
    log('💡 Server siap. Pilih ZIP atau single download.', 'info');
</script>
</body>
</html>
